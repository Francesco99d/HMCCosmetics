name: Build HMCCosmetics

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch: # Permette l'avvio manuale

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        # Usiamo clean per una build pulita e saltiamo i test per velocità
        run: ./gradlew clean build -x test

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HMCCosmetics-Binaries
          # Il doppio asterisco (**) cerca in TUTTE le sottocartelle
          path: "**/build/libs/*.jar"
          # Questo evita che la build passi se non trova davvero nulla
          if-no-files-found: error
